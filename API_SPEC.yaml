openapi: 3.0.3
info:
  title: "Matching API"
  description: "API specification for Matching. Error response mapping is Needs confirmation because no global exception handler is visible."
  version: "0.1.0"
servers:
  - url: "Needs confirmation"
    description: "Needs confirmation"
tags:
  - name: "Matchings"
paths:
  /matchings:
    post:
      tags: ["Matchings"]
      summary: "Create a matching request"
      description: "Creates a matching request for the authenticated requester. /matchings/** requires authentication."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchingCreateRequest"
      responses:
        "201":
          description: "Matching created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingCreateApiResponse"
        default:
          description: "Needs confirmation"
  /matchings/inbox:
    get:
      tags: ["Matchings"]
      summary: "Get received matchings"
      description: "Currently returns an empty list from service code. Intended received matching policy is Needs confirmation."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Received matchings returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingListApiResponse"
        default:
          description: "Needs confirmation"
  /matchings/me:
    get:
      tags: ["Matchings"]
      summary: "Get sent matchings"
      description: "Returns matchings created by the authenticated requester, ordered by created_at descending."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Sent matchings returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingListApiResponse"
        default:
          description: "Needs confirmation"
  /matchings/{matching-id}/approve:
    patch:
      tags: ["Matchings"]
      summary: "Approve a matching"
      description: "Approves a REQUESTED matching. Requester cannot approve their own matching. Host ownership policy is Needs confirmation."
      security:
        - bearerAuth: []
      parameters:
        - name: "matching-id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "Matching approved."
        default:
          description: "Needs confirmation"
  /matchings/{matching-id}/reject:
    patch:
      tags: ["Matchings"]
      summary: "Reject a matching"
      description: "Rejects a REQUESTED matching. Requester cannot reject their own matching. Host ownership policy is Needs confirmation."
      security:
        - bearerAuth: []
      parameters:
        - name: "matching-id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "Matching rejected."
        default:
          description: "Needs confirmation"
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          nullable: true
    MatchingCreateRequest:
      type: object
      required: [space_id, start_time, end_time, total_price]
      properties:
        space_id:
          type: integer
          format: int64
        start_time:
          type: string
          description: "Parsed as OffsetDateTime or LocalDateTime. Exact accepted format is Needs confirmation."
        end_time:
          type: string
          description: "Parsed as OffsetDateTime or LocalDateTime and must be after start_time."
        total_price:
          type: string
          description: "Must parse to a non-negative integer."
    MatchingCreateResponse:
      type: object
      properties:
        matching_id:
          type: integer
          format: int64
    MatchingListResponse:
      type: object
      properties:
        matchings:
          type: array
          items:
            $ref: "#/components/schemas/MatchingSearchResponse"
    MatchingSearchResponse:
      type: object
      properties:
        matching_id:
          type: integer
          format: int64
        space_id:
          type: integer
          format: int64
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        total_price:
          type: integer
          format: int32
        status:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, CANCELED]
        created_at:
          type: string
          format: date-time
    MatchingCreateApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MatchingCreateResponse"
    MatchingListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MatchingListResponse"
  responses: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
